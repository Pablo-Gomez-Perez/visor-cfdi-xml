name: Java 17 - build y pruebas
on:
  push:
    branches:
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Preparar JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: app/pom.xml
      - name: Instalar XSD SAT desde una revision fija del espejo
        run: bash scripts/instalar-esquemas-sat.sh "${{ runner.temp }}/sat-xsd"
      - name: Maven verify
        env:
          VISOR_SAT_XSD_DIR: ${{ runner.temp }}/sat-xsd
        run: mvn --batch-mode --no-transfer-progress -f app/pom.xml verify
